<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta http-equiv="refresh" content="0; url=https://notratz.github.io/NarakaTweaks" />
    <title>Redirecting to NarakaTweaks...</title>
    <link rel="icon" type="image/png" href="/favicon.png" />
    <style>
      body {
        font-family: system-ui, sans-serif;
        background: linear-gradient(135deg, #0c0d14, #1a1b2e);
        color: white;
        margin: 0;
        padding: 0;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        text-align: center;
      }
      .container {
        padding: 2rem;
        border-radius: 12px;
        background: rgba(255, 255, 255, 0.05);
        border: 1px solid rgba(255, 255, 255, 0.1);
        max-width: 500px;
        margin: 20px;
      }
      h1 {
        margin: 0 0 1rem 0;
        font-size: 2rem;
        font-weight: 600;
      }
      p {
        margin: 0 0 1.5rem 0;
        color: #cbd5e1;
        line-height: 1.6;
      }
      .link {
        display: inline-block;
        padding: 0.75rem 1.5rem;
        background: #0ea5e9;
        color: white;
        text-decoration: none;
        border-radius: 8px;
        font-weight: 600;
        transition: background 0.2s;
      }
      .link:hover {
        background: #0284c7;
      }
      .spinner {
        display: inline-block;
        width: 20px;
        height: 20px;
        border: 2px solid rgba(255, 255, 255, 0.3);
        border-radius: 50%;
        border-top-color: #0ea5e9;
        animation: spin 1s linear infinite;
        margin-right: 10px;
      }
      @keyframes spin {
        to { transform: rotate(360deg); }
      }
    </style>
    <script>
      // Redirect immediately
      window.location.replace('https://notratz.github.io/NarakaTweaks');
    </script>
  </head>
  <body>
    <div class="container">
      <h1>🔧 NarakaTweaks</h1>
      <p>
        <span class="spinner"></span>
        Redirecting you to the new NarakaTweaks site...
      </p>
      <p>
        If you're not redirected automatically, 
        <a href="https://notratz.github.io/NarakaTweaks" class="link">click here</a>
      </p>
    </div>
  </body>
</html>
