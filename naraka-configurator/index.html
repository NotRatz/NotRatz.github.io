<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Naraka Settings Configurator</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body class="naraka-bg">
    <header class="site-header">
      <img src="/assets/strive-logo.png" alt="Strive" />
      <h1>Naraka Bladepoint · Settings Configurator</h1>
      <div style="margin-left:auto;display:flex;gap:8px;align-items:center">
        <a class="toolbar cta" href="/index.html">Home</a>
        <a class="toolbar" href="/ScrimPrep/">ScrimPrep</a>
        <a class="toolbar" href="https://notratz.github.io/NarakaTweaks" target="_blank" rel="noopener">NarakaTweaks</a>
      </div>
      <p class="muted">Edit settings and export <code>QualitySettingsData.json</code> — no login required.</p>
    </header>

    <main class="layout">
      <section class="panel" id="editor-panel">
        <div class="toolbar">
          <div style="display:flex;gap:8px;align-items:center">
            <button id="btn-reset">Reset</button>
            <button id="btn-load-file">Load…</button>
            <input id="file-input" type="file" accept="application/json" style="display:none" />
          </div>
          <div style="margin-left:auto;display:flex;gap:8px;align-items:center">
            <button id="btn-copy">Copy</button>
            <button id="btn-download" class="cta">Download</button>
          </div>
        </div>
        <div class="presets">
          <div class="section-title">Presets</div>
          <div id="preset-chips" style="display:flex;gap:8px;flex-wrap:wrap;margin-top:8px"></div>
        </div>

        <div id="editor"></div>
      </section>

      <aside class="panel" id="preview-panel">
        <h2>Preview</h2>
        <pre id="json-preview" class="preview"></pre>
        <div class="presets">
          <label>Presets:</label>
          <select id="preset-select">
            <option value="">-- choose preset --</option>
            <option value="low">Low</option>
            <option value="medium">Medium</option>
            <option value="high">High</option>
            <option value="custom">Custom (no changes)</option>
          </select>
        </div>
      </aside>
    </main>

    <footer class="footer muted">Reference: https://old.naraka.wiki/en/Graphic-Settings</footer>

    <script src="./app.js"></script>
  </body>
</html>
