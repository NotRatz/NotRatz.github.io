<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="../favicon.png" />
    <link rel="shortcut icon" href="../favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ScrimPrep - Character Strategy Planner</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://unpkg.com/aos@3.0.0-beta.6/dist/aos.css" />
    <!-- Use site base styles so ScrimPrep visually matches the rest of the site -->
    <link rel="stylesheet" href="../src/styles/base.css" />
    <style>
      /* Small page-specific tweaks */
      select, button { outline: none; }
      .angled-tile, .hero-tile { position: relative; overflow: hidden; transition: transform 0.3s ease; }
      .angled-tile { clip-path: polygon(0 0, 100% 0, 100% 85%, 85% 100%, 0 100%); }
      .hero-tile { clip-path: polygon(15% 0, 100% 0, 100% 100%, 0 100%, 0 15%); }
      .group:hover .angled-tile, .group:hover .hero-tile { transform: scale(1.05); }
      .angled-tile::before, .hero-tile::before { content: ""; position: absolute; inset: 0; border: 2px solid rgba(250, 204, 21, 0.8); opacity: 0; transition: opacity 0.3s ease; pointer-events: none; }
      .group:hover .angled-tile::before, .group:hover .hero-tile::before { opacity: 1; }
    </style>
  </head>
  <body class="bg-base-900 text-white min-h-screen overflow-x-hidden">
    <!-- Unified Navigation -->
    <nav class="site-nav">
      <div class="site-nav-content">
        <a href="../" class="site-nav-logo">
          <img src="/assets/strive-logo.png" alt="Strive" />
          Team Strive
        </a>
        <div class="site-nav-links">
          <a href="../" class="site-nav-link">Home</a>
          <a href="https://notratz.github.io/NarakaTweaks" target="_blank" class="site-nav-link">NarakaTweaks</a>
          <a href="/ScrimPrep/" class="site-nav-link active">ScrimPrep</a>
          <a href="../naraka-configurator/" class="site-nav-link">Configurator</a>
        </div>
      </div>
    </nav>

    <!-- Page Title -->
    <header class="page-header content-container" data-aos="fade-up">
      <h1 class="page-title">
        ScrimPrep - Character Strategy Planner
      </h1>
      <p class="page-subtitle">
        Plan your team's character selections for 6 rounds. Build optimal strategies and counter-picks for competitive scrims.
      </p>
    </header>

    <!-- Configurator Mount -->
    <main id="root" class="content-container section" data-aos="fade-up"></main>

    <!-- React + Babel -->
    <script
      src="https://unpkg.com/react@18/umd/react.development.js"
      crossorigin
    ></script>
    <script
      src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"
      crossorigin
    ></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <!-- dom-to-image-more for PNG export (lightweight client-side DOM->PNG) -->
  <script src="https://unpkg.com/dom-to-image-more@2.10.0/dist/dom-to-image-more.min.js"></script>

    <!-- AOS + nav helper (same pattern as home) -->
    <script src="https://unpkg.com/aos@3.0.0-beta.6/dist/aos.js"></script>
    <script>
      if (window.AOS) AOS.init({ once: true, duration: 800 });
      function nav(e) {
        if (!e) return true;
        const link = e.currentTarget || e.target;
        const href = link && link.getAttribute && link.getAttribute("href");
        if (!href) return true;
        e.preventDefault();
        window.location.href = href;
        return false;
      }
    </script>

    <!-- Component (same folder) -->
    <script
      type="text/babel"
      src="immortal_war_configurator_react.jsx"
    ></script>

    <!-- Mount -->
    <script type="text/babel">
      ReactDOM.createRoot(document.getElementById("root")).render(
        <ImmortalWarConfigurator />,
      );
    </script>
  </body>
</html>
